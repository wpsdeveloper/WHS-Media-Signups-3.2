sorigin=\"anonymous\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js\" integrity=\"sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL\" crossorigin=\"anonymous\"><\/script>";

ress\" data-bs-placement=\"right\">\n                <i class=\"info-icon fa-solid fa-circle-info\"></i>\n              </a>\n            </label>\n            <input type=\"email\" class=\"form-control disabled\" id=\"email\" value=\"\" disabled></input>\n          </div>\n          \n          \x3C!-- Student name (shown for staff ) -->\n          <div class=\"col col-12 staff-only \">\n            <div class=\"mb-4 intervention-only assessment-only tutoring-only non-intervention-only alt-setting-only\">\n              <label for=\"student\" class=\"form-label main-label\">\n                Student\n              </label>\n              <input type=\"text\" class=\"form-control disabled student-autocomplete\" id=\"student\"></input>\n            </div>\n          </div>\n\n          <div class=\"row\">\n            \x3C!-- Date requested  -->\n            <div class=\"mb-4 col-12 col-lg-6\">\n              <div class=\"mb-4\">\n                <label for=\"date\" class=\"form-label main-label required\">\n                  Date Requested\n                </label>\n                <input type=\"date\" class=\"form-control date-input required\" id=\"date\"></input>\n              </div>\n            </div>\n\n            \x3C!-- Period requested  -->\n            <div class=\"mb-4 col-12 col-lg-6\">\n              <div class=\"mb-4\">\n                <label for=\"date\" class=\"form-label main-label required\">\n                  Period Requested\n                </label>\n                <select class=\"form-select required\" id=\"period\"></select>\n              </div>\n            </div>\n          </div>\n\n          \x3C!-- Signup type  -->\n          <div class=\"row mb-4\" id=\"type\">\n            <div class=\"col\" >\n              <label class=\"mb-2 main-label\">Signup Type</label>\n              \n              \x3C!-- Interventions  -->\n              <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"radio\" name=\"signup-type\" id=\"intervention\" value=\"Intervention\"/>\n                <label class=\"form-check-label\" for=\"intervention\">\n                  <a href=\"#\" data-bs-toggle=\"tooltip\" data-bs-title=\"For extra help with academic learning\" data-bs-placement=\"right\">\n                    Intervention \n                    <a class=\"int-link schedule-link d-none\" href=\"#\" data-doc-id=\"\" target=\"_blank\">(schedule)</a> \n                  </a>\n                </label>\n              </div>\n\n              \x3C!-- Assessment makeup  -->\n              <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"radio\" name=\"signup-type\" id=\"assessment\" value=\"Assessment\"/>\n                <label class=\"form-check-label\" for=\"assessment\">\n                  <a href=\"#\" data-bs-toggle=\"tooltip\" data-bs-title=\"For a quiet place to makeup a test, quiz, or other work\" data-bs-placement=\"right\">\n                    Assessment make-up \n                  </a>\n                </label>\n              </div>\n\n              \x3C!-- NHS Tutoring  -->\n              <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"radio\" name=\"signup-type\" id=\"tutoring\" value=\"Tutoring\"/>\n                <label class=\"form-check-label\" for=\"tutoring\">\n                  <a href=\"#\" data-bs-toggle=\"tooltip\" data-bs-title=\"During March, get academic help from National Honor Society students\" data-bs-placement=\"right\">\n                    NHS tutoring \n                    <a class=\"tut-link schedule-link d-none\" href=\"#\" data-doc-id=\"\" target=\"_blank\">(schedule)</a> \n                  </a>\n                </label>\n              </div>\n\n              \x3C!-- Non-intervention  -->\n              <div class=\"form-check\">\n                <input class=\"form-check-input\" type=\"radio\" name=\"signup-type\" id=\"non-intervention\" value=\"Non-intervention\" checked />\n          </div>\n\n        </div>\n\n        \x3C!-- Right-hand panel  -->\n        <div class=\"col-12 col-lg-6 d-flex flex-column\">\n          \n          \x3C!-- Teacher & Subject for interventions  -->\n          <div class=\"mb-4 intervention-only\">\n            <label for=\"subject\" class=\"form-label main-label\">\n              Teacher & Subject\n            </label>\n            <select id=\"subject-int-select\" class=\"form-select subject-int\" name=\"subject-int\">\n            </select>\n\n            \x3C!-- Fallback input if select box is broken -->\n            <input class=\"form-control d-none subject-int\" id=\"subject-int-input\" name=\"subject-int\"></input> \n          </div>\n\n          \x3C!-- Subject for other types  -->\n          <div class=\"mb-4 tutoring-only assessment-only alt-setting-only\">\n            <label for=\"subject\" class=\"form-label main-label\">\n              Subject\n            </label>\n            <select id=\"subject-non-int\" class=\"form-select\">\n              <option value=\"Business\">Business</option>\n              <option value=\"English\">English</option>\n              <option value=\"Mathematics\">Mathematics</option>\n              <option value=\"Physical Education & Health\">Physical Education & Health</option>\n              <option value=\"Science\">Science</option>\n              <option value=\"Social Studies\">Social Studies</option>\n              <option value=\"Technology\">Technology</option>\n              <option value=\"World Language\">World Language</option>\n              <option value=\"Other\">Other</option>\n            </select>\n          </div>\n\n          \x3C!-- Topic/comments -->\n          <div class=\"mb-4 intervention-only assessment-only tutoring-only alt-setting-only staff-reservation-only\">\n            <label class=\"main-label intervention-only assessment-only tutoring-only alt-setting-only\" for=\"topic-intervention\">\n              Topic for help/name of assessment/reason for assistance\n            </label>\n            <label class=\"main-label staff-reservation-only\" for=\"topic-intervention\">\n              Reason for visit\n            </label>\n            <label class=\"intervention-only assessment-only tutoring-only alt-setting-only\" for=\"topic-intervention\">\n              Please be as specific as possible.\n            </label>\n            <textarea class=\"form-control intervention-only assessment-only tutoring-only alt-setting-only staff-reservation-only\" id=\"topic-intervention\"></textarea>\n          </div>\n\n          \x3C!-- Non-intervention purpose  -->\n          <div class=\"mb-4 non-intervention-only\" id=\"purpose\">\n            <label class=\"mb-2 main-label\">Purpose</label>\n\n            \x3C!-- Group project  -->\n            <div class=\"form-check\">\n              <input class=\"form-check-input\" type=\"radio\" name=\"purpose\" id=\"group-project\" value=\"Group project\" />\n              <label class=\"form-check-label\" for=\"purpose\">\n                Group project <br><span class=\"hint\">You will need to be working on a legitimate project and may need to produce a note from your teacher.</span>\n              </label>\n            </div>\n            \n            \x3C!-- Individual research  -->\n            <div class=\"form-check\">\n              <input class=\"form-check-input\" type=\"radio\" name=\"purpose\" id=\"research\" value=\"Research\" checked/>\n              <label class=\"form-check-label\" for=\"purpose\">\n                Individual research project/use of library resources\n              </label>\n            </div>\n\n            \x3C!-- Software Use  -->\n            <div class=\"form-check\">\n              <input class=\"form-check-input\" type=\"radio\" name=\"purpose\" id=\"software\" value=\"Software\"/>\n              <label class=\"form-check-label\" for=\"purpose\">\n                Software on desktop computers\n              </label>\n
