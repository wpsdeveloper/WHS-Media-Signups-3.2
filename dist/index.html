		for (const mutation of mutations) {
			if (mutation.type !== "childList") continue;

	}).observe(document, {
		childList: true,

	});

		const fetchOpts = {};

		if (link.crossOrigin === "use-credentials") fetchOpts.credentials = "include";
		else if (link.crossOrigin === "anonymous") fetchOpts.credentials = "omit";
		else fetchOpts.credentials = "same-origin";
		return fetchOpts;
	}

		if (link.ep) return;
		link.ep = true;
		const fetchOpts = getFetchOpts(link);
		fetch(link.href, fetchOpts);

/* In Details view or List view, remove the label spacer so the edit button vertically centers with details text */
.data-row:has(.details-info:not(.d-none)) .edit-icons .checkin-box-label-wrapper,
.data-row:not(:has(.attendance-info:not(.d-none))) .edit-icons .checkin-box-label-wrapper {
  display: none !important;
}

.row-action-btn,
.edit-icons .edit-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  min-width: 26px;
  max-width: 26px;
  height: 26px;
  min-height: 26px;
  max-height: 26px;
  padding: 0;
  box-sizing: border-box;
  border-radius: 6px;
  color: var(--wps-text-subtle);
  background-color: transparent;
  border: 1px solid transparent;
  font-size: 0.825rem;
  line-height: 1;
  transition: all 0.15s ease-in-out;
  cursor: pointer;
  text-decoration: none;
  vertical-align: middle;
}

.row-action-btn:hover,
.edit-icons .edit-link:hover {
  color: var(--wps-blue-primary);
  background-color: var(--wps-blue-tint);
  border-color: var(--wps-border);
  box-shadow: 0 1px 3px rgba(4, 35, 80, 0.08);
}

   ========================================================================== */
.admin {
  background-color: var(--wps-bg);
  min-height: 100vh;
}

.admin .tab-panel {
  display: none;
}

.admin .tab-panel.active {
  display: block;
}

.admin .admin-tabs.nav-tabs {
  border-bottom: none;
  gap: 10px;
}

.admin .admin-tabs .nav-link {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 8px;
  padding: 8px 18px;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
}

.admin .admin-tabs .nav-link:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.22);
  border-color: rgba(255, 255, 255, 0.4);
}

.admin .admin-tabs .nav-link.active {
  color: var(--wps-navy);
  background: #ffffff;
  border-color: #ffffff;
  font-weight: 700;
  border-top: 3px solid var(--wps-orange);
  box-shadow: 0 3px 8px rgba(4, 35, 80, 0.15);
}

.admin .header-row {
  padding: 6px 14px;
  font-size: 0.85rem;
  border-bottom: none;
  margin-bottom: 8px;
}

.admin .header-row h4 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
  color: var(--wps-blue-primary);
  font-family: 'Open Sans', sans-serif;
  margin: 0;
}

.admin .header-row h4.sortable:hover {
  color: var(--wps-navy);
}

.admin .data-row,
.admin .data-row.student-row-empty {
  padding: 10px 14px;

  border: 1px solid var(--wps-border);
  border-radius: 8px;
  margin-bottom: 10px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  box-shadow: 0 1px 3px rgba(4, 35, 80, 0.03);
}

.admin .data-row.student-row:hover,
.admin .data-row.settings-row:hover {
  border-color: var(--wps-border-strong);

}

.admin .data-row .signup-date,
.admin .data-row .signup-period {

.admin .student-row .study-teacher {

}

.admin .student-row .type {

  color: var(--wps-text-subtle);
  font-size: 0.85rem;
}

.admin .student-row .room {
  color: var(--wps-blue-primary);
  font-size: 0.825rem;

.admin .student-row .comments {
  font-size: 0.825rem;
  color: var(--wps-text-subtle);
}

.admin .settings-row .description {
  font-weight: 600;
  color: var(--wps-text-main);

}

.admin .settings-row .value input:not([type="checkbox"]):not([type="radio"]) {

.admin .settings-row .value input:not([type="checkbox"]):not([type="radio"]):focus {

  box-shadow: 0 0 0 0.2rem rgba(246, 92, 2, 0.2);

/* App Settings Slider Switch Toggle - Theme Styled */
.admin .form-switch {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0;
  padding-left: 2.75rem;
  min-height: 1.5rem;
}

.admin .settings-row .value input.setting-toggle-switch {
  cursor: pointer;
  width: 2.35rem !important;
  height: 1.25rem !important;
  margin-left: -2.75rem !important;
  background-color: #dee2e6 !important;
  border: 1px solid #adb5bd !important;
  border-radius: 2rem !important;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%236c757d'/%3e%3c/svg%3e") !important;
  background-position: left center !important;
  background-repeat: no-repeat !important;
  background-size: contain !important;
  transition: background-position 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out !important;
  appearance: none !important;
  -webkit-appearance: none !important;
}

.admin .settings-row .value input.setting-toggle-switch:checked {
  background-color: var(--wps-blue-primary) !important;
  border-color: var(--wps-blue-primary) !important;
  background-position: right center !important;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23ffffff'/%3e%3c/svg%3e") !important;
}

.admin .settings-row .value input.setting-toggle-switch:focus {
  border-color: var(--wps-blue-vibrant) !important;
  outline: 0 !important;
  box-shadow: 0 0 0 0.2rem rgba(20, 66, 130, 0.25) !important;
}

.admin .setting-toggle-label {
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  user-select: none;
}

.edit-icons .edit-link {
  color: var(--wps-blue-primary);
  border-color: var(--wps-border);
  background-color: var(--wps-bg);
  transition: all 0.15s ease;
}

.edit-icons .edit-link:hover {
  background-color: var(--wps-blue-primary);
  color: #ffffff;
  border-color: var(--wps-blue-primary);
}
