                <input\r
                  class="form-check-input"\r
                  type="radio"\r
                  name="glass-room"\r
                  id="glass-room-1"\r
                  value="1"\r
                />\r
                <label\r
                  class="form-check-label"\r
                  for="glass-room"\r
                  id="glass-room-1-label"\r
                >\r
                  Glass room 1 (<span class="availability">Available</span>)\r
                </label>\r
              </div>\r
\r
              \x3C!-- Glass Room 2  -->\r
              <div class="form-check staff-only">\r
                <input\r
                  class="form-check-input"\r
                  type="radio"\r
                  name="glass-room"\r
                  id="glass-room-2"\r
                  value="2"\r
                />\r
                <label\r
                  class="form-check-label"\r
                  for="glass-room"\r
                  id="glass-room-2-label"\r
                >\r
                  Glass room 2 (<span class="availability">Available</span>)\r
                </label>\r
              </div>\r
            </div>\r
          </div>\r
        </div>\r
      </div>\r
\r
      \x3C!-- Full-width column for submit buttons  -->\r
      <div class="col-12">\r
        <div class="mb-4 text-center text-md-end">\r
          \x3C!-- Submit button for new data  -->\r
          <button class="btn btn-accent btn-orange submit-button mx-auto" id="btn-submit">\r
            Submit\r
          </button>\r
\r
          \x3C!-- Update button for changing existing data  -->\r
          <button\r
            class="btn btn-primary submit-button mx-auto d-none"\r
            id="btn-update"\r
          >\r
            Update\r
          </button>\r
\r
          \x3C!-- Delete button for removing data  -->\r
          <button\r
            class="btn btn-danger submit-button mx-auto d-none"\r
            id="btn-delete"\r
            onclick="deleteData()"\r
          >\r
            Delete Request\r
          </button>\r
        </div>\r
      </div>\r
    </div>\r
\r
    \x3C!-- Hidden div, for showing "Successful submission" when complete -->\r
    <div\r
      id="success-box"\r
      class="position-absolute top-50 start-50 translate-middle d-none text-center"\r
    >\r
      <h3>Success!</h3>\r
      <p>\r
        Your request has been successfully submitted. Please check your email\r
        for a confirmation receipt.\r
      </p>\r
      <p>\r
        <i\r
          >Remember to check in with your study hall teacher before reporting to\r
          the media center!</i\r
        >\r
      </p>\r
      <button class="btn btn-primary staff-only success-box-start-over">\r
        Start over\r
      </button>\r
    </div>\r
\r
    \x3C!-- Hidden div, for showing "Successful update" when complete -->\r
    <div\r
      id="success-update-box"\r
      class="position-absolute top-50 start-50 translate-middle d-none text-center"\r
    >\r
      <h3>Success!</h3>\r
      <p>\r
        Your update has been saved. Click\r
        <a\r

          class="script-link"\r
          href=""\r
          target="_top"\r
          >here</a\r
        >\r
        to return to the attendance page.\r
      </p>\r
    </div>\r
  </div>\r
\r
  \x3C!-- Modal: Loading -->\r
  <div\r

    tabindex="-1"\r

  >\r

      <div class="modal-content">\r
        <div class="modal-body">\r
          <div class="d-flex">\r
            <div class="spinner-border text-primary me-3" role="status">\r

            <div class="loading-text">Loading rubric data</div>\r
          </div>\r
        </div>\r
      </div>\r
    </div>\r
  </div>\r

  \x3C!-- Modal: Date/Period are full (deprecated)  -->\r

            class="btn btn-secondary"\r
            data-bs-dismiss="modal"\r
          >\r
            Close\r
          </button>\r
        </div>\r
      </div>\r
    </div>\r
  </div>\r
\r
  \x3C!-- Toast (green): Success -->\r
  <div\r
    class="toast-container position-fixed p-5 top-0 start-50 translate-middle-x"\r

      class="toast text-bg-success align-items-center"\r

      aria-live="assertive"\r
      aria-atomic="true"\r

      <div class="d-flex">\r

          type="button"\r
          class="btn-close btn-close-white me-2 m-auto"\r
          data-bs-dismiss="toast"\r
          aria-label="Close"\r
        ></button>\r
      </div>\r
    </div>\r
  </div>\r

        ></button>\r
      </div>\r
    </div>\r

          aria-label="Close"\r

  </div>\r
