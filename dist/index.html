(function polyfill() {
	const relList = document.createElement("link").relList;
	if (relList && relList.supports && relList.supports("modulepreload")) return;
	for (const link of document.querySelectorAll("link[rel=\"modulepreload\"]")) processPreload(link);
	new MutationObserver((mutations) => {
		for (const mutation of mutations) {
			if (mutation.type !== "childList") continue;
			for (const node of mutation.addedNodes) if (node.tagName === "LINK" && node.rel === "modulepreload") processPreload(node);
		}
	}).observe(document, {
		childList: true,
		subtree: true
	});
	function getFetchOpts(link) {
		const fetchOpts = {};
		if (link.integrity) fetchOpts.integrity = link.integrity;
		if (link.referrerPolicy) fetchOpts.referrerPolicy = link.referrerPolicy;
		if (link.crossOrigin === "use-credentials") fetchOpts.credentials = "include";
		else if (link.crossOrigin === "anonymous") fetchOpts.credentials = "omit";
		else fetchOpts.credentials = "same-origin";
		return fetchOpts;
	}
	function processPreload(link) {
		if (link.ep) return;
		link.ep = true;
		const fetchOpts = getFetchOpts(link);
		fetch(link.href, fetchOpts);
	}
})();

  font-family: 'Roboto Slab', serif;
}

header h1 {
  font-size: 1.6rem;
}

.page-title h1 {
  padding: 0;
}

h4 {
  margin-bottom: 0;
  font-size: 1.2rem;
}

h4.sortable {
  cursor: pointer;
}

h1, header h1 {
  padding-top: 20px;
  color: #F65C02; /* WPS Orange */
}

h2.step-header {
  font-size: 1.3rem;
  padding-bottom: 8px;
  color: #01256F; /* WPS Text Blue */
}

/* ==========================================================================
   Layout & Global Components
   ========================================================================== */
header {
  background: #042350; /* WPS Blue */
}

header .logo img {
  height: 75px;
  margin: 0 auto;
  padding: 10px;
}

.subheader {
  background: #4984D1;
}

#tools {
  padding: 10px 0;
}

#tools .col {
  text-align: center;
}

#tools .pager {
  padding: 0 15px;
  color: #01256F; /* WPS Text Blue */
}

.step-card {
  background: #fff;
  border: 1px #aaa solid;
  box-sizing: border-box;
  border-radius: 8px;
  padding: 20px;
  -webkit-box-shadow: -1px 1px 4px 0px rgba(128,128,128,0.5); 
  box-shadow: -1px 1px 4px 0px rgba(128,128,128,0.5);
}

/* ==========================================================================
   Forms & Buttons
   ========================================================================== */
.subheader .form-control,
.subheader .form-select {
  width: auto;
}

.form-control.invalid,
.form-select.invalid {
  border: 1px solid red;
}

.form-control:disabled {
  background-color: #EBF3FF;
}

.btn-orange {
  --bs-btn-color: #fff;
  --bs-btn-bg: #F65C02;
  --bs-btn-border-color: #F65C02;
  --bs-btn-hover-color: #fff;
  --bs-btn-hover-bg: #f77226;
  --bs-btn-hover-border-color: #f0691b;
  --bs-btn-focus-shadow-rgb: 60, 153, 110;
  --bs-btn-active-color: #fff;
  --bs-btn-active-bg: #f0691b;
  --bs-btn-active-border-color: #f5630f;
  --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
  --bs-btn-disabled-color: #fff;
  --bs-btn-disabled-bg: #F65C02;
  --bs-btn-disabled-border-color: #F65C02;
}

.checkin-btn.btn{
  --bs-btn-bg: #4984D1;
  --bs-btn-color: #fff;
  --bs-btn-hover-bg: #1b63c2;
   --bs-btn-hover-color: #fff;
}

/* ==========================================================================
   Utilities & Helpers
   ========================================================================== */
.edit-only {
  display: none !important;
}

.loading .spinner-border {
  margin: 0 auto;
}

.hint, .signup #purpose .hint {
  font-size: 75%;
}

.hide-left {
  left: -100%;
}

.hide-right {
  left: 100%;
}

.sort-icon i {
  font-size: 75%;
  opacity: 50%;
}

.sort-icon .active {
  opacity: 100%;
}

.sort-icon .loading {
  display: none;
}

.type-warning {
  font-size: 75%;
  text-decoration: italic; /* Note: This was left strictly as written, but 'text-decoration: italic' is invalid CSS; it should likely be 'font-style: italic' if you ever intend to fix it. */
}

/* ==========================================================================
   Feature: Typeahead
   ========================================================================== */
span.twitter-typeahead {
  display: block !important;
}

.tt-menu {
  width: 422px;
  margin-top: 12px;
  padding: 8px 8px;
  background-color: #fff;
  border: 1px solid #ccc;
  border: 1px solid rgba(0, 0, 0, 0.2);
  border-radius: 8px;
  box-shadow: 0 5px 10px rgba(0,0,0,.2);
  max-height: 300px;
  overflow-y: auto;
}

/* ==========================================================================
   Feature: Signup
   ========================================================================== */
.signup {
  background: #EBF3FF; /*pale blue background*/
  min-height: 100vh;
  width: 100%;
}

.signup {
  .main-label {
    font-weight: bold;
  }

  .info-icon {
    color: #8AAEE3;
  }

  #type a[data-bs-toggle="tooltip"] {
    text-decoration: none;
    color: inherit;
  }

  #type .schedule-link {
    font-size: 80%;
  }

  #type .staff-only-type {
    font-style: italic;
  }

  .editor-only {
    display: none;
  }
}

/* ==========================================================================
   Feature: Attendance
   ========================================================================== */
.attendance .data-row,
.attendance .data-row.student-row-empty {
  padding: 5px 0px;
 /* margin: 10 0px; /* Note: '10' is missing a unit (like px), preserved here exactly as written to ensure no visual changes. */
  /* min-height: 90px; */
  background-color: #FFF;
  overflow: hidden;
}

.attendance {
  .data-row {
    .student-name {
      font-weight: bold;
    }
    
    .study-teacher {
      font-size: 80%;
      font-weight: bold;
      font-style: italic;
    }

    .type {
      font-style: italic;
    }
    
    button {
      font-size: 60%;
    }
    
    .attendance-info {
      label {
       font-size: 75%;
      }
     .time-value {
        color: green;
        font-weight: bold;
      }
    }
  }
    
  .room-badge {
    position: relative;
    font-size: 60%;
    margin-left: 10px;
    display: inline-block;
    top: -2px;
    /* margin-bottom: 8px; */
  }

  .room {
    min-height: 2.0rem;

    .status {
      margin-left: 5px;
    }

    &.available .status {
      color: #4984D1;
    }
  }
  
  
  .panel-link {

    cursor: pointer;

    &:not(.active) {
      color: blue;
      text-decoration: underline;
    }
    
    &.active {
      font-weight: bold;
    }
  }
  
  .slider-wrapper {
    overflow: hidden;
    padding-bottom: 12px;
  }
  
  .slider {
    position: relative;
    display: flex;
    overflow: hidden;
  }
  
  .panel {
    flex: 1 0 100%;
    position: relative;
    transition: transform 0.5s ease;
    background: #EBF3FF;
    padding: 5px;
    border-radius: 8px;
    border: 1px solid #EBF3FF;
    -webkit-box-shadow: 1px 1px 1px 0px rgba(128,128,128,0.3) inset; 
     box-shadow: 1px 1px 1px 0px rgba(128,128,128,0.5) inset;
  }



  .staff-row .comments {
    font-size: 80%;
  }
}

.panel.attendance-info .cancel {
  cursor: pointer;
}

/* ==========================================================================
   Feature: Admin
   ========================================================================== */
.admin .tab-panel {
  display: none;

  &.active {
    display: block;
  }
}

.admin .nav-link {
  color: white;

  &.active {
    color: black;
  }
}/*$vite$:1*/</style>
