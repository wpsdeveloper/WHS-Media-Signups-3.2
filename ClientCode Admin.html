/**

 */ 
 function initializeTabs() {
  const tabContainer = document.querySelector(".nav-tabs");
  const tabs = document.querySelectorAll(".nav-link");
  const panels = document.querySelectorAll(".tab-panel");

  tabContainer.addEventListener("click", (e) => {
    const targetId = e.target.dataset.target;
    console.log(e);
    if (targetId) {
      // 1. Remove 'active' class from all buttons and panels
      tabs.forEach(tab => tab.classList.remove('active'));
      panels.forEach(content => content.classList.remove('active'));

      // 2. Add 'active' class to clicked button and target panel
      e.target.classList.add('active');
      document.getElementById(targetId).classList.add('active');
    }
  });
}

function getAppSettings() {
  DOWNLOADED.settings = false;

  .withFailureHandler(processError)
  .withSuccessHandler(receiveAppSettings)

}

function receiveAppSettings(dataJSON) {
  SETTINGS = JSON.parse(dataJSON);
  console.log(SETTINGS);

  populateSettingsTable(SETTINGS);

  DOWNLOADED.settings = true;
  checkAllDownloaded();
}

function populateSettingsTable(settings) {
  const table = $("#settings-panel");

  settings.forEach(settingRow => {
    const key = settingRow[0];
    const value = settingRow[1];
    const description = settingRow[2];
    const comments = settingRow[3];
    const type = settingRow[4];

    const stRow = $("#templates #settings-row-template").clone().appendTo(table);
    $(stRow).removeAttr("id");
    $(stRow).find(".key").text(key);
    $(stRow).find(".description").text(description);
    $(stRow).find(".comments").html(`<small>${comments}</small>`);
    const input = $(stRow).find(".value input");

    switch(type) {
      case "string":
      case "string-array":
        $(input).val(value).prop("type", "text");
        break;
      case "integer":
        $(input).val(value).prop("type", "number");
        break;
      case "boolean":
        const on = (value==="On") || (value==="true");
        $(input).removeClass("form-control").addClass("form-check-input")
        .prop("type", "checkbox").prop("checked", on);
        break;
      case "date":
        console.log(new Date(value));
        const date = new Date(value);
        // Format date to YYYY-MM-DD (handling timezone offset issues)
        const day = ("0" + date.getDate()).slice(-2);
        const month = ("0" + (date.getMonth() + 1)).slice(-2);
        const year = date.getFullYear();
        $(input).prop("type", "date").val(`${year}-${month}-${day}`)
        
        break;
    }
  })
}

      }
    }
    if (foundIndex < 0) {
      return;
    }
    const input = $(row).find("input");
    let newValue = "";
    switch (SETTINGS[foundIndex][4]) {
      case "string":
      case "string-array":
      case "integer":
      case "date":

        break;
      case "boolean":
        newValue = $(input).is(":checked") ? "On" : "Off";
        break;
      }

    });

}

/**
 *  Responds to a Checkin button click 
 * 
 * @param {string} type The specific category of checkin (e.g. "mediaOut")
 * @type {button} button The button that was clicked 
 * */
function checkin(type, button) {
  // determines the rowId of the signup belonging to that button
  const id = $(button).closest(".student-row").attr("data-signup-id");
  
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  const box = $(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  $(box).find(".spinner").show().removeClass("d-none");
  $(box).find("button").hide();
  $(box).find(".time").hide();

  // sets the value to the current time
  const now = new Date();
  
  // sends the checkin request to the server for async processing
  setCheckin(type, id, formatTime(now));

  const thisSignup = SIGNUPS.filter(su => su.rowId == id);
  thisSignup.forEach(su => {
    su[type] = now.toISOString();
  });
}

/**

function checkinSuccess(returnVal) {
  const type = returnVal.type;

}

function formatCheckin(type, id, value, alreadyFormatted) {
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  // Updates the checkin box UI
  const box = $(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  $(box).find(".spinner").hide();

  if (value === "") {
    $(box).find("button").show();
    $(box).find(".time").hide();
    $(box).find(".time-value").text("");
  } else {
    $(box).find("button").hide();
    $(box).find(".time").show();
    $(box).find(".time").removeClass("d-none");
    if (alreadyFormatted) {
      $(box).find(".time-value").text(value);
    } else {
      $(box).find(".time-value").text(formatTime(new Date(value)));
    }
  }
}

/**
 * Helper function to format a Date as MM/DD/YYYY 
 * 
 * @param {Date} date The date to format
 * @return {string} The formatted date
 * */
function formatDateSlashes(date) {
  return (date.getMonth()+1) +"/" + date.getDate() + "/" + date.getFullYear();
}

/**
 * Helper function to format a Date as MM/DD/YYYY 
 * 
 * @param {Object} date The date to format
 * @return {string} The formatted date
 * */
function formatDateShort(date) {
  if (!(date instanceof Date)) {
    date = new Date(date);
  }
  return (`${WEEKDAY[date.getDay()]}, ${MONTH[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`);
}

/**
 * Helper function to format a Time as HH:MM AM/PM 
 * 
 * @param {Date} date The Datetime to format
 * @return {string} The formatted time
 * */
function formatTime(date) {
  let hours = date.getHours();
  let minutes = date.getMinutes();
  let ampm = "AM";

  if (hours >= 12) {
    ampm = "PM";
  }
  if (hours > 12) {
    hours = hours - 12;
  }
  // console.log(date, hours);

  if (minutes < 10) {
    minutes = "0" + minutes
  }

  return `${hours}:${minutes} ${ampm}`;
}

/**
 *  Helper function to determined if two Dates are on the same day 
 * */
function isSameDate(date1, date2) {
  const monthMatch = date1.getMonth() === date2.getMonth();
  const yearMatch = date1.getFullYear() === date2.getFullYear();
  const dateMatch = date1.getDate() === date2.getDate();

  return monthMatch && yearMatch && dateMatch;
}

/**
 * Populates data into the form (useful for editing existing data)
 */
function populateSignupTable() {
  sortSignups(CURRENT_SORT.FIELD, CURRENT_SORT.ORDER);
  clearTable();

  const currentSignups = SIGNUPS;

  if (currentSignups.length === 0) {
    $(".student-row-empty").show().removeClass("d-none");
    return;
  }

  $(".student-row-empty").hide();
  
  currentSignups.forEach(signup => {
    // adds a new empty student row
    let stRow;
      if (signup.type === "Staff reservation") {
        const table = $("#staff-table");
        stRow = $("#templates #staff-row-template").clone().appendTo(table);
      } else {
        const table = $("#student-panel");
        stRow = $("#templates #student-row-template").clone().appendTo(table);
      }

    // places the row id into the row HTML element as "data-signup-id"
    $(stRow).removeAttr("id");
    $(stRow).attr("data-signup-id", signup.rowId);

    // fills names
    let roomIcon = "";
    if ((signup.room === "1") || (signup.room === 1)) {
      roomIcon = `<span class="badge text-bg-success room-badge">Room 1</span>`;
    } else if ((signup.room === "2") || (signup.room === 2)) {
      roomIcon = `<span class="badge text-bg-danger room-badge">Room 2</span>`;
    }

    // adds edit icons if the user is an editor
    if (IS_EDITOR) {
      $(stRow).find('.edit-icons').removeClass("d-none").addClass("d-inline");
      const href = $(stRow).find('.edit-icons a.edit-link').attr("href") + "&id=" + signup.rowId;
      $(stRow).find('.edit-icons a.edit-link').attr("href", href);
    }

    // adds details to the row
    if (signup.type === "Intervention") {
      $(stRow).find('.type').text(`Intervention: ${signup.subject}`);
    } else if (signup.type === "Tutoring") {
      $(stRow).find('.type').text(`NHS Tutoring: ${signup.subject}`);
    } else if (signup.type === "Assessment") {
      $(stRow).find('.type').text(`Assessment Makeup: ${signup.teacherAcad}`);
    } else if (signup.type === "Alt setting") {
      $(stRow).find('.type').text(`Alt Setting for ${signup.teacherAcad}`);
    } else if (signup.type === "Non-intervention") {
      $(stRow).find('.type').text(`Non-Intervention (${signup.purpose}/${signup.teacherAcad})`);
    } else if (signup.type === "Staff reservation") {
      $(stRow).find('.type').text(`Staff reservation`);
    }
 
    // populates checkin time data
    if (signup.studyIn1.length > 0) {
      formatCheckin("studyIn1", signup.rowId, signup.studyIn1);
    }
    if (signup.mediaIn.length > 0) {
      formatCheckin("mediaIn", signup.rowId, signup.mediaIn);
    }
    if (signup.mediaOut.length > 0) {
      formatCheckin("mediaOut", signup.rowId, signup.mediaOut);
    }
    if (signup.studyIn2.length > 0) {
      formatCheckin("studyIn2", signup.rowId, signup.studyIn2);
    }

    $(stRow).find('.date').html(`${formatDateShort(signup.date)}`);

    // saves new current date/time, returns if either is empty
    if (signup.period === "Wed. PM") {
      $(stRow).find('.period').html(`${signup.period}`);
      $(".wed-int").show();
      $(".not-wed-int").hide();
      $(".study-checkin button").text("Done");
    } else {
      $(stRow).find('.period').html(`Period ${signup.period}`);
      $(".wed-int").hide();
      $(".not-wed-int").show();
      $(".study-checkin button").text("Check in");
    }
    // adds other simple data
    $(stRow).find('.study-teacher').text(`${signup.teacherStudy}`);
    $(stRow).find('.comments').text(`${signup.comments}`);
    $(stRow).find('.room').text("");
    if (signup.room !== "" ) {
      $(stRow).find('.room').text(`Glass Room ${signup.room}, reserved by ${signup.email}`);
    }
  });
}

/**
 *  Prevents default HTML submission behavior (generally, prevent form submit if the user hits Enter) 
 * */
function preventFormSubmit() {
  var forms = document.querySelectorAll('form');
  for (var i = 0; i < forms.length; i++) {
    forms[i].addEventListener('submit', function(event) {
      event.preventDefault();
    });
  }
};

/**
 *  Responds to new sort request 
 * 
 * @param {string} field The field to sort by
 * */
function resort(field) {
  if (CURRENT_SORT.FIELD === field) {
    CURRENT_SORT.ORDER = CURRENT_SORT.ORDER === "asc" ? "desc" : "asc";
  }
  CURRENT_SORT.FIELD = field;

  // updates the sort icon UI
  $(".sort-icon i").removeClass("active");

  $(".sort-icon i").removeClass("fa-caret-up");
  $(".sort-icon i").removeClass("fa-caret-down");
  
  if (CURRENT_SORT.FIELD === "date") {
      $(".sort-date").addClass('active');
  } else if (CURRENT_SORT.FIELD === "period") {
      $(".sort-period").addClass('active');
  }
  
  if (CURRENT_SORT.ORDER === "asc") {
    $(".sort-icon i.active").addClass('fa-caret-down');
    $(".sort-icon i.active").removeClass('fa-caret-up');
  } else {
    $(".sort-icon i.active").removeClass('fa-caret-down');
    $(".sort-icon i.active").addClass('fa-caret-up');
  }

  // rebuild the table (with the new sort order)
  populateSignupTable();
}

/**
 * Sorts the signup data according to the current sort order.
 * 
 * @param {string} field The data to sort by
 * @param {string} order The sort order, either 'asc' or 'desc'
 * */
function sortSignups(field, order) {
  if (field === "date") {
    sortSignupsByField("period", "asc");
    sortSignupsByField("date", order);
  } else if (field === "period") {
    sortSignupsByField("date", "desc");
    sortSignupsByField("period", order);
  }
}

/**
 * The sort function for a field. 
 * Note: designed for string data. Not tested with numbers. 
 * 
 * @param {string} field The data to sort by
 * @param {string} order The sort order, either 'asc' or 'desc'
 *  */
function sortSignupsByField(field, asc) {
  const modifier = (asc === "asc") ? 1 : -1;
  SIGNUPS.sort((a,b) => {
    if (a[field] < b[field]) {
      return  -1 * modifier;
    } else if (a[field] > b[field]) {
      return  modifier;
    } else {
      return 0;
    }
  });
}

  // remembers current selection. If this period is available in the new list,
  const oldPeriodVal = LAST_DATA.period;
  LAST_DATA.date = $("#date").val();
  
  // returns if no date selected
  if (LAST_DATA.date === "") {
    return;
  }
  try {
    // clear previous options
    $("#period option").remove();

    // gets the data selected
    const date = new Date(LAST_DATA.date);
    
    // cycles through daily schedules...
    DAILY_SCHEDULES.forEach(schedule => {
      const schedDate = new Date(schedule.date);

      // for a matching date, creates an option for each period
      if (isSameDate(schedDate, date)) {
        schedule.periods.forEach(period => {
          $("#period").append(`<option value="${period}">${period}</option>`);
        })
      }
    })

    // console.log(date, wednesdayInterventions(date));
    if (wednesdayInterventions(date)) {
      $("#period").append(`<option value="Wed. PM">Wed. PM</option>`);
    }

    // reselects the previously selected period, if possible
    if (oldPeriodVal !== null) {
      $("#period").val(oldPeriodVal);
    } else {
      $("#period").val($("#period option").first().val());
    }
  } catch (error) {
    processError(error);
  }
}

/**
 * Determines if the Wednesday Interventions is active and should be shown.
 * 
 * param {Date} - the date to show
 * return {boolean} - True is should be shown
 */
function wednesdayInterventions(date) {
  const wednesday = 3;
  const weekday = date.getDay();
  const dateIsWednesday = (weekday === wednesday);
  const wedIntActive = ($("#wed-int-active").val() === "true");

  // console.log("Wed Int - returning "+ (dateIsWednesday && wedIntActive));
  return dateIsWednesday && wedIntActive;
}
