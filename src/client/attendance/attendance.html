<!-- Main display -->
<div class="body attendance">
  <!-- Header/masthead -->
  <header>
    <div class="container-fluid">
      <div class="row pb-2 pt-2 align-items-center">
        <!-- Logo image -->
        <div
          class="logo col-12 col-sm-1 col-lg-1 d-flex flex-row align-items-center"
        >
          <img
            id="logo-image"
            src="https://lh3.googleusercontent.com/d/17G7OFQmeOX8h8CKG9497rA5RNPRNl7uc"
            data-logo-id=""
            alt="Walpole Public Schools"
          />
        </div>
        <div class="col text-center page-title">
          <h1 class="text-center text-md-start">
            Intervention & Media Center
            <span class="d-inline d-md-none"><br /></span>Attendance
          </h1>
        </div>

        <!-- Buttons/links to other pages  -->
        <div
          class="link-icons col-12 col-sm-2 col-lg-3 d-flex align-items-center justify-content-center"
        >
          <a
            id="signup-link"
            class="staff-only btn btn-light script-link"
            href="?page=signup"
            target="_top"
            >Signup Form</a
          >
          <a
            id="admin-link"
            class="admin-only btn btn-light ms-1 script-link"
            href="?page=admin"
            target="_top"
            >Admin</a
          >
        </div>
      </div>
    </div>
  </header>

  <!-- Date and period section  -->
  <div class="subheader p-3 mb-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col col-12 d-flex justify-content-center">
          <div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main body container  -->
  <div class="container">
    <div id="form" class="row g-2">
      <!-- Step 1 -->
      <div class="col-12 col-lg-3">
        <div class="step-card">
          <h2 class="step-header">
            <i class="fa-solid fa-calendar-days"></i>
            Controls
          </h2>

          <!-- Date selection -->
          <div class="d-block mb-2 d-lg-inline">
            <input
              type="date"
              class="form-control date-input required d-inline"
              id="date"
            />
          </div>

          <!-- Period selection  -->
          <div class="d-block mt-2 mb-2">
            <select class="form-select required d-inline" id="period"></select>
          </div>

          <!-- Group selection  -->
          <div class="d-block mt-2 mb-2">
            <select class="form-select required d-inline" id="study-select"></select>
          </div>

          <!-- Data refresh button -->
          <div class="d-block text-end">
            <button id="refresh-data-btn" class="btn btn-primary">
              Refresh
            </button>
          </div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="col-12 col-lg-6">
        <div class="step-card h-100">
          <div class="d-flex flex-row">
            <div class="flex-grow-1">

              <h2 class="step-header">
                <i class="fa-solid fa-address-card"></i>
                Students
              </h2>
            </div>
            <div class="flex-grow-0">
              <div class="panel-links-group d-inline-flex">
                <span class="active panel-link attendance-panel-link">Attendance</span>
                <span class="panel-link details-panel-link">Details</span>
                <span class="panel-link list-panel-link">List</span>
              </div>
            </div>
          </div>

          <!-- Main data table  -->
          <div id="student-table" class="">
            <!-- Data not found row  -->
            <div class="row student-row-empty d-none">
              <div class="col">No records found</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="col-12 col-lg-3">
        <div class="row g-2">
          <div class="col-12">
            <div id="glass-rooms-status" class="step-card">
              <h2 class="step-header">
                <i class="fa-solid fa-person-chalkboard"></i>
                Glass Rooms
              </h2>

              <!-- Room 1 Status -->
              <div class="d-block room room-1">
                <span class="badge text-bg-success room-badge">Room 1</span>
                <span class="status"></span>
              </div>

              <!-- Room 2 Status -->
              <div class="d-block room room-2">
                <span class="badge text-bg-danger room-badge">Room 2</span>
                <span class="status"></span>
              </div>
            </div>
          </div>

          <div class="col">
            <div class="step-card">
              <h2 class="step-header">
                <i class="fa-solid fa-school"></i>
                Staff Reservations
              </h2>

              <!-- Main data table  -->
              <div id="staff-table" class="">
                <!-- Data not found row  -->
                <div class="row staff-row-empty d-none">
                  <div class="col">No records found</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Templates for repeatable sections of the page. Hidden at first, cloned and inserted by javascript when needed -->
<section id="templates" style="display: none">
  <!-- Tri-state button (not currently used)  -->
  <div id="custom-checkbox-template">
    <div class="custom-checkbox mb-2 d-flex">
      <span type="checkbox" class="form-check-input tri-state"></span>
      <label for="feedback" class="form-check-label ms-1"> </label>
    </div>
  </div>

  <!-- Student row of data  -->
  <template id="student-row-template">
    <div class="data-row student-row mb-2">
      <div class="row mb-2">
        <!-- Column 1  -->
        <div class="col-8">
          <!-- Edit icons (shown to editors only) -->
          <div class="edit-icons d-inline d-none me-1 text-secondary">
            <a class="edit-link script-link" href="?page=update" target="_blank"
              ><i class="fas fa-edit"></i
            ></a>
          </div>

          <!-- Student name  -->
          <div class="student-name d-inline"></div>
        </div>

        <!-- Study hall teacher  -->
        <div class="study-teacher col-4 text-end"></div>
      </div>

      <div class="row">
        <div id="" class="slider-wrapper col col-12 mb-2" data-items="2">
          <div class="slider">
            <!-- Panel: Attendance  -->
            <div class="panel attendance-info">
              <div class="row">
                <div
                  data-type="study-checkin"
                  class="checkin-box study-checkin col-6 col-lg-3 order-1 text-center"
                ></div>
                <div
                  data-type="media-checkin"
                  class="checkin-box media-checkin col-6 col-lg-3 order-3 order-lg-2 text-center"
                ></div>
                <div
                  data-type="media-checkout"
                  class="checkin-box media-checkout not-wed-int col-6 col-lg-3 order-4 order-lg-3 text-center"
                ></div>
                <div
                  data-type="study-return"
                  class="checkin-box study-return not-wed-int col-6 col-lg-3 order-2 order-lg-4 text-center"
                ></div>
              </div>
            </div>

            <!-- Panel: Details  -->
            <div class="panel details-info">
              <div class="row">
                <div class="type col-12"></div>
                <div class="comments col-12"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="checkin-box">
    <div class="checkin-box-inner">
      <div class="checkin-box-label-wrapper">
        <label class="checkin-box-label text-muted mb-1 d-block"></label>
      </div>

      <!-- UI elements  -->
      <!-- 1. Ready state: clean compact action button -->
      <button class="checkin-btn btn btn-sm btn-outline-primary py-0 px-2 fw-semibold">Check In</button>

      <!-- 2. Recorded state & Edit mode wrapper -->
      <div class="time d-none">
        <!-- Clickable timestamp badge (90% view case) -->
        <span 
          class="time-badge badge bg-success-subtle text-success-emphasis border border-success-subtle px-2 py-1 user-select-none" 
          role="button" 
          tabindex="0"
          title="Click to edit or clear time"
        >
          <span class="time-value"></span>
          <i class="fa-solid fa-pen ms-1 edit-hint-icon text-muted opacity-75"></i>
        </span>

        <!-- Inline editor (10% edit case) -->
        <div class="time-edit d-none align-items-center justify-content-center gap-1 mt-1">
          <input class="form-control form-control-sm text-center py-0 px-1 border-primary" style="max-width: 82px; font-size: 0.8rem; height: 26px;" type="time" />
          <button type="button" class="btn btn-sm btn-success save-btn p-0 px-1" style="height: 26px; line-height: 1;" title="Save (Enter)">
            <i class="fa-solid fa-check"></i>
          </button>
          <button type="button" class="btn btn-sm btn-outline-danger delete-btn p-0 px-1" style="height: 26px; line-height: 1;" title="Clear timestamp">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary cancel-btn p-0 px-1" style="height: 26px; line-height: 1;" title="Cancel (Esc)">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Loading spinner -->
      <div class="spinner d-none py-1">
        <div class="spinner-border spinner-border-sm text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </template>

  <!-- Staff row of data  -->
  <template id="staff-row-template">
    <div class="row data-row staff-row mb-2">
      <!-- Column 1  -->
      <div class="col col-12 mb-2">
        <!-- Edit icons (shown to editors only) -->
        <div class="edit-icons d-inline d-none me-1 text-secondary">
          <a class="edit-link script-link" href="?page=update" target="_blank"
            ><i class="fas fa-edit"></i
          ></a>
        </div>

        <!-- Student name  -->
        <div class="student-name d-inline"></div>
      </div>

      <!-- Column 2  -->
      <!-- none  -->

      <!-- Column 3  -->
      <div class="comments col-12"></div>
    </div>
  </template>
</section>

<!-- Modal: Loading -->
<div
  class="modal"
  id="loading-modal"
  tabindex="-1"
  aria-labelledby="loadingModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex">
          <div class="spinner-border text-primary me-3" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <div class="loading-text"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast (green): Success -->
  <div
    class="toast-container position-fixed p-5 top-0 start-50 translate-middle-x"
  >
    <div
      id="success-toast"
      class="toast text-bg-success align-items-center"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body">Submission complete!</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
    </div>
  </div>

  <!-- Toast (red): Error  -->
  <div
    class="toast-container position-fixed p-5 top-0 start-50 translate-middle-x"
  >
    <div
      id="error-toast"
      class="toast text-bg-danger align-items-center"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body">Error completing submission.</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
    </div>
  </div>

  <!-- Toast (red): Invalid data (not used)  -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div
      id="validation-error-toast"
      class="toast text-bg-danger align-items-center"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body">Please complete the missing information.</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
    </div>
  </div>

  <!-- Helper area for storing data sent from the server -->
  <div class="d-none hidden-data">
    <input id="is-editor" type="checkbox" value="false" />
    <input id="is-admin" type="checkbox" value="false" />
    <input id="wed-int-active" type="checkbox" value="true" />
  </div>

  <!-- Javacript libraries and files -->
  <script
    src="https://kit.fontawesome.com/1a74660f3b.js"
    crossorigin="anonymous"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
  ></script>
</div>
