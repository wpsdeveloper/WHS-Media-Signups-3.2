// Arrays of data to download
let SIGNUPS = [];         // previous signup data
let DAILY_SCHEDULES = []; // daily schedules for each date in the current school year

// Page settings
let IS_EDITOR = false;    // whether the current user may edit existing data
let IS_ADMIN = false;
let CURRENT_SORT = {      // the current data sort setting
  FIELD: "study", 
  ORDER: "asc"
  };
const DOWNLOADED = {      // indicates when certain pieces of data have been downloaded asynchronously
  schedules: false,
  signups: false,
};
const LAST_DATA = {        // tracks the last data shown
  date: null,
  period: null,
}

const qs = (selector, root = document) => root.querySelector(selector);
const qsa = (selector, root = document) => [...root.querySelectorAll(selector)];
const setVisible = (elements, visible) => {
  const list = elements instanceof Element ? [elements] : elements;
  list.forEach(element => element?.classList.toggle("d-none", !visible));
};
const setText = (selector, text, root = document) => {
  const element = typeof selector === "string" ? qs(selector, root) : selector;
  if (element) element.textContent = text ?? "";
};
const showModal = id => bootstrap.Modal.getOrCreateInstance(qs(id)).show();
const hideModal = id => bootstrap.Modal.getOrCreateInstance(qs(id)).hide();
const showToast = id => bootstrap.Toast.getOrCreateInstance(qs(id)).show();

/* Initialization, after all html and scripts have loaded */
document.addEventListener("DOMContentLoaded", () => {
  const dateInput = qs(".date-input");
  const today = new Date();
  const toDateValue = date => date.toISOString().slice(0, 10);
  if (dateInput) {
    const minDate = new Date(today);
    const maxDate = new Date(today);
    minDate.setDate(today.getDate() - 14);
    maxDate.setDate(today.getDate() + 7);
    dateInput.type = "date";
    dateInput.min = toDateValue(minDate);
    dateInput.max = toDateValue(maxDate);
    dateInput.value = toDateValue(today);
  }
  
  // sets the editor status
  IS_EDITOR = qs("#is-editor")?.value === "true";
  checkAdminStatus();

  // requests download of daily schedules
  getDailySchedules();

  // requests download of recent signups
  getSignups();

  // shows the Loading modal
  showLoadingModal("Retrieving data");
});

/**
 * Sets up the page based on whether the current user is admin
 */
function checkAdminStatus() {
  IS_ADMIN = qs("#is-admin")?.value === "true";
  qsa(".admin-only").forEach(element => {
    element.classList.toggle("d-none", !IS_ADMIN);
    element.classList.remove("d-flex");
  });
}

/**
 * Responds to a checkin cancel X button click
 * 
 * @param {string} type The specific category of checkin (e.g. "mediaOut")
 * @type {button} button The button that was clicked 
 * */
function cancelCheckin(type, button) {
  // determines the rowId of the signup belonging to that button
  const id = button.closest(".student-row").dataset.signupId;
  
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  // shows a loading UI for the button
  const box = qs(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  setVisible(qs(".spinner", box), true);
  qsa("button, .time", box).forEach(element => setVisible(element, false));
  
  // sets the value to blank i.e. a blank (cleared) cell in the spreadsheet
  const value = "";
  
  // sends the checkin request to the server for async processing
  setCheckin(type, id, value)
}

/**
 *  Responds to a Checkin button click 
 * 
 * @param {string} type The specific category of checkin (e.g. "mediaOut")
 * @type {button} button The button that was clicked 
 * */
function checkin(type, button) {
  // determines the rowId of the signup belonging to that button
  const id = button.closest(".student-row").dataset.signupId;
  
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  const box = qs(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  setVisible(qs(".spinner", box), true);
  qsa("button, .time", box).forEach(element => setVisible(element, false));

  // sets the value to the current time
  const now = new Date();
  
  // sends the checkin request to the server for async processing
  setCheckin(type, id, formatTime(now));

  const thisSignup = SIGNUPS.filter(su => su.rowId == id);
  thisSignup.forEach(su => {
    su[type] = now.toISOString();
  });
}

  // matches the type with a div class

function cancelEditCheckin(type, button) {

  // matches the type with a div class

function editCheckin(type, button) {
  // determines the rowId of the signup belonging to that button
  const id = button.closest(".student-row").dataset.signupId;
  
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  const box = qs(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  const inputtedValue = qs("input", box)?.value || "";
  if (!isValidTime(inputtedValue)) {
    qs(".validation-error", box)?.remove();
    const error = document.createElement("span");
    error.className = "validation-error text-danger";
    error.innerHTML = "<small>Invalid time</small>";
    box.append(error);
    return;
  }
  qs(".validation-error", box)?.remove();
  
  setVisible(qs(".spinner", box), true);
  qsa("button, .time", box).forEach(element => setVisible(element, false));
 
  // sends the checkin request to the server for async processing
  setCheckin(type, id, inputtedValue);

  const thisSignup = SIGNUPS.filter(su => su.rowId == id);
  thisSignup.forEach(su => {
    su[type] = inputtedValue;
  });
}

function isValidTime(timeStr) {
  // Regex Breakdown:
  // ^              : Start of the string
  // (1[0-2]|0?[1-9]) : Hours 1-12 (allows optional leading zero for 1-9)
  // :              : Literal colon
  // [0-5][0-9]     : Minutes 00-59
  // \s?            : Optional space (common in user input)
  // (am|pm)        : The meridian (case-insensitive via 'i' flag)
  // $              : End of the string
  
  const regex = /^(1[0-2]|0?[1-9]):[0-5][0-9]\s?(am|pm)$/i;
  return regex.test(timeStr);
}

/**
 *  Receives checkin data results 
 * */
function checkinSuccess(returnVal) {
  const type = returnVal.type;
  const id = returnVal.id;
  const value = returnVal.value;

  formatCheckin(type, id, value);
}

function formatCheckin(type, id, value) {
  // matches the type with a div class
  const divClass = {
    "studyIn1": ".study-checkin",
    "mediaIn": ".media-checkin",
    "mediaOut": ".media-checkout",
    "studyIn2": ".study-return",
  };

  // Updates the checkin box UI
  const box = qs(`.student-row[data-signup-id="${id}"] ${divClass[type]}`);
  setVisible(qs(".spinner", box), false);

  if (value === "") {
    qsa("button", box).forEach(element => setVisible(element, true));
    setVisible(qs(".time", box), false);
    const timeInput = qs(".time-value input", box);
    if (timeInput) timeInput.value = "";
    setVisible(qs(".time-edit", box), false);
  } else {
    qsa("button", box).forEach(element => setVisible(element, false));
    setVisible(qs(".time", box), true);
    setText(".time-value", formatTime(value), box);
    setVisible(qs(".primary-buttons", box), true);
    setVisible(qs(".time-edit", box), false);
    const timeInput = qs(".time-edit input", box);
    if (timeInput) timeInput.value = formatTime(value);
  }
}

/**
 *  Responds to a change of the Date field

/**
 * Helper function to format a Date as MM/DD/YYYY 
 * 
 * @param {Date} date The date to format
 * @return {string} The formatted date
 * */
function formatDateSlashes(date) {
  return (date.getMonth()+1) +"/" + date.getDate() + "/" + date.getFullYear();
}

/**
 * Helper function to format a Time as HH:MM AM/PM 
 * 
 * @param {Date} date The Datetime to format
 * @return {string} The formatted time
 * */
function formatTime(date) {
  if (isValidTime(date)) {
    return date;
  }

  if (!(date instanceof Date)) {
    date = new Date(date);
  }

  let hours = date.getHours();
  let minutes = date.getMinutes();
  let ampm = "AM";

  if (hours >= 12) {
    ampm = "PM";
  }
  if (hours > 12) {
    hours = hours - 12;
  }

  if (minutes < 10) {
    minutes = "0" + minutes
  }

  return `${hours}:${minutes} ${ampm}`;
}

/**
 *  Helper function to determined if two Dates are on the same day 
 * */
function isSameDate(date1, date2) {
  const monthMatch = date1.getMonth() === date2.getMonth();
  const yearMatch = date1.getFullYear() === date2.getFullYear();
  const dateMatch = date1.getDate() === date2.getDate();

  return monthMatch && yearMatch && dateMatch;
}

/**
 *  Responds to a change of the Period field 
 * */
function periodChanged() {
  // clear the "current" status from all rows
  qsa(".data-row").forEach(row => row.classList.remove("current-period", "current-date"));

  // saves new current date/time, returns if either is empty
  LAST_DATA.date = qs("#date")?.value || "";
  if (LAST_DATA.date === "") {
    return;
  }
  LAST_DATA.date = new Date(LAST_DATA.date);

  LAST_DATA.period = qs("#period")?.value || null;
  if (LAST_DATA.period === null) {
    return;
  }

  if (LAST_DATA.period === "Wed. PM") {
    setVisible(qsa(".wed-int"), true);
    setVisible(qsa(".not-wed-int"), false);
    qsa(".study-checkin button").forEach(button => { button.textContent = "Done"; });
  } else {
    setVisible(qsa(".wed-int"), false);
    setVisible(qsa(".not-wed-int"), true);
    qsa(".study-checkin button").forEach(button => { button.textContent = "Check in"; });
  }

  qsa(".data-row").forEach(row => {
    const id = row.dataset.signupId;

    // finds the signup data for this row's id
    const match = SIGNUPS.filter(su => su.rowId === id);
    if (match.length !== 1) {
      return;
    }
    const signup = match[0];

    // gets the signup's date, and marks the row "current" if it matched the selection
    let suDate = signup.date;
    if (typeof suDate === "string") {
      suDate = new Date(suDate);
    }

    if (isSameDate(LAST_DATA.date, suDate)) {
      row.classList.add("current-date");
    } 

    // gets the signup's period, and marks the row "current" if it matched the selection
    let suPeriod = "" + signup.period;
    if (LAST_DATA.period === suPeriod) {
      row.classList.add("current-period");
    }
  });

  // if no current date/time data for students, shows the "No records" row
  if (qsa(".student-row.current-period.current-date").length <= 0) {
    setVisible(qsa(".student-row-empty"), true);
  } else {
    setVisible(qsa(".student-row-empty"), false);
  }

  // if no current date/time data for staff, hides the staff table
  if (qsa(".staff-row.current-period.current-date").length <= 0) {
    setVisible(qs("#staff-table"), false);
  } else {
    setVisible(qs("#staff-table"), true);
  }
}

/**
 * Populates data into the form (useful for editing existing data)
 */
function populateSignupTable() {
  sortSignups(CURRENT_SORT.FIELD, CURRENT_SORT.ORDER);
  clearTable();

  // sets the new current date/period
  LAST_DATA.date = new Date(qs("#date")?.value);
  LAST_DATA.period = qs("#period")?.value || null;

  const currentSignups = SIGNUPS.filter(su => (isSameDate(new Date(su.date), LAST_DATA.date)));

  currentSignups.forEach(signup => {
    // adds a new empty student row
    let stRow;
      if (signup.type === "Staff reservation") {
        const table = qs("#staff-table");
        stRow = qs("#templates #staff-row-template").cloneNode(true);
        table.append(stRow);
      } else {
        const table = qs("#student-table");
        stRow = qs("#templates #student-row-template").cloneNode(true);
        table.append(stRow);
      }

    // places the row id into the row HTML element as "data-signup-id"
    stRow.removeAttribute("id");
    stRow.dataset.signupId = signup.rowId;
    
    // assigns current-date or current-period tags if appropriate
    if (LAST_DATA.period === "" + signup.period) {
      stRow.classList.add("current-period");
    } 
    const date = new Date(signup.date);
    if (isSameDate(date, LAST_DATA.date)) {
      stRow.classList.add("current-date");
    }

    // fills names
    let roomIcon = "";
    if ((signup.room === "1") || (signup.room === 1)) {
      roomIcon = `<span class="badge text-bg-success room-badge">Room 1</span>`;
    } else if ((signup.room === "2") || (signup.room === 2)) {
      roomIcon = `<span class="badge text-bg-danger room-badge">Room 2</span>`;
    }
    qs('.student-name', stRow).innerHTML = `${signup.lastname}, ${signup.firstname}${roomIcon}`;

    // adds edit icons if the user is an editor
    if (IS_EDITOR) {
      qs('.edit-icons', stRow)?.classList.remove("d-none");
      qs('.edit-icons', stRow)?.classList.add("d-inline");
      const editLink = qs('.edit-icons a.edit-link', stRow);
      if (editLink) editLink.href = `${editLink.href}&id=${signup.rowId}`;
    }

    // adds details to the row
    if (signup.type === "Intervention") {
      setText('.type', `Intervention: ${signup.subject}`, stRow);
    } else if (signup.type === "Tutoring") {
      setText('.type', `NHS Tutoring: ${signup.subject}`, stRow);
    } else if (signup.type === "Assessment") {
      setText('.type', `Assessment Makeup: ${signup.teacherAcad}`, stRow);
    } else if (signup.type === "Alt setting") {
      setText('.type', `Alt Setting for ${signup.teacherAcad}`, stRow);
    } else if (signup.type === "Non-intervention") {
      setText('.type', `Non-Intervention (${signup.purpose}/${signup.teacherAcad})`, stRow);
    } else if (signup.type === "Staff reservation") {
      setText('.type', "Staff reservation", stRow);
    }
  
    // populates checkin time data
    if (signup.studyIn1.length > 0) {
      formatCheckin("studyIn1", signup.rowId, signup.studyIn1);
    }
    if (signup.mediaIn.length > 0) {
      formatCheckin("mediaIn", signup.rowId, signup.mediaIn);
    }
    if (signup.mediaOut.length > 0) {
      formatCheckin("mediaOut", signup.rowId, signup.mediaOut);
    }
    if (signup.studyIn2.length > 0) {
      formatCheckin("studyIn2", signup.rowId, signup.studyIn2);
    }

    // adds other simple data
    setText('.study-teacher', signup.teacherStudy, stRow);
    setText('.comments', signup.comments, stRow);
    setText('.room', "", stRow);
    if (signup.room !== "" ) {
      setText('.room', `Glass Room ${signup.room}, reserved by ${signup.email}`, stRow);
    }
  });

  // resets other UI elements
  periodChanged();
}

/**
 *  Prevents default HTML submission behavior (generally, prevent form submit if the user hits Enter) 
 * */
function preventFormSubmit() {
  var forms = document.querySelectorAll('form');
  for (var i = 0; i < forms.length; i++) {
    forms[i].addEventListener('submit', function(event) {
      event.preventDefault();
    });
  }
};

 * Responds generically to a server error
 * 
 * @param {Error} error The sent error
 * */

  console.log(SIGNUPS.map(x => x.date).sort());
  populateSignupTable();

/**
 *  Responds to new sort request 
 * 
 * @param {string} field The field to sort by
 * */
function resort(field) {
  if (CURRENT_SORT.FIELD === field) {
    CURRENT_SORT.ORDER = CURRENT_SORT.ORDER === "asc" ? "desc" : "asc";
  }
  CURRENT_SORT.FIELD = field;

  // updates the sort icon UI
  qsa(".sort-icon i").forEach(icon => icon.classList.remove("active", "fa-caret-up", "fa-caret-down"));
  
  if (CURRENT_SORT.FIELD === "student") {
      qs(".sort-student")?.classList.add("active");
  } else if (CURRENT_SORT.FIELD === "study") {
      qs(".sort-study")?.classList.add("active");
  }
  
  if (CURRENT_SORT.ORDER === "asc") {
    qs(".sort-icon i.active")?.classList.add("fa-caret-down");
    qs(".sort-icon i.active")?.classList.remove("fa-caret-up");
  } else {
    qs(".sort-icon i.active")?.classList.remove("fa-caret-down");
    qs(".sort-icon i.active")?.classList.add("fa-caret-up");
  }

  // rebuild the table (with the new sort order)
  populateSignupTable();
}

/**
 * Sorts the signup data according to the current sort order.
 * 
 * @param {string} field The data to sort by
 * @param {string} order The sort order, either 'asc' or 'desc'
 * */
function sortSignups(field, order) {
  if (field === "student") {
    sortSignupsByField("firstname", order);
    sortSignupsByField("lastname", order);
  } else if (field === "study") {
    sortSignupsByField("teacherStudy", order);
  }
}

/**
 * The sort function for a field. 
 * Note: designed for string data. Not tested with numbers. 
 * 
 * @param {string} field The data to sort by
 * @param {string} order The sort order, either 'asc' or 'desc'
 *  */
function sortSignupsByField(field, asc) {
  const modifier = (asc === "asc") ? 1 : -1;
  SIGNUPS.sort((a,b) => {
    if (a[field] < b[field]) {
      return  -1 * modifier;
    } else if (a[field] > b[field]) {
      return  modifier;
    } else {
      return 0;
    }
  });
}

/**
 *  Updates the Periods select box based on the date 
 * */
function updatePeriodList() {
  // remembers current selection. If this period is available in the new list,
  const oldPeriodVal = LAST_DATA.period;
  LAST_DATA.date = qs("#date")?.value || "";
  
  // returns if no date selected
  if (LAST_DATA.date === "") {
    return;
  }
  try {
    // clear previous options
    qs("#period").replaceChildren();

    // gets the data selected
    const date = new Date(LAST_DATA.date);
    
    // cycles through daily schedules...
    DAILY_SCHEDULES.forEach(schedule => {
      const schedDate = new Date(schedule.date);

      // for a matching date, creates an option for each period
      if (isSameDate(schedDate, date)) {
        schedule.periods.forEach(period => {
          const option = document.createElement("option");
          option.value = period;
          option.textContent = period;
          qs("#period").append(option);
        })
      }
    })

    if (wednesdayInterventions(date)) {
      const option = document.createElement("option");
      option.value = "Wed. PM";
      option.textContent = "Wed. PM";
      qs("#period").append(option);
    }

    // reselects the previously selected period, if possible
    if (oldPeriodVal !== null) {
      qs("#period").value = oldPeriodVal;
    } else {
      qs("#period").value = qs("#period option")?.value || "";
    }
  } catch (error) {
    processError(error);
  }
  periodChanged();
}

/**
 * Determines if the Wednesday Interventions is active and should be shown.
 * 
 * param {Date} - the date to show
 * return {boolean} - True is should be shown
 */
function wednesdayInterventions(date) {
  const wednesday = 3;
  const weekday = date.getDay();
  const dateIsWednesday = (weekday === wednesday);
  const wedIntActive = qs("#wed-int-active")?.value === "true";

  return dateIsWednesday && wedIntActive;
}
